name: dsv4-gb300-ab-smoke-sidecar
model:
  path: deepseek-v4-pro
  container: nvcr.io/nvidian/dynamo-dev/sglang-runtime:connorc-beb91b0-e2728ac-dsv4-gb300-ab-arm64
  precision: fp4
dynamo:
  hash: beb91b0de5392af2bd36560b312c153e7dbed061
  install: false
slurm:
  time_limit: 03:00:00
sbatch_directives:
  cpus-per-task: '144'
  mem: '0'
resources:
  gpu_type: gb300
  gpus_per_node: 4
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 4
  decode_nodes: 1
  decode_workers: 1
  gpus_per_decode: 4
frontend:
  type: dynamo
  enable_multiple_frontends: true
  num_additional_frontends: 8
backend:
  type: sglang
  prefill_environment:
    PYTHONUNBUFFERED: '1'
    SGLANG_RADIX_FORCE_MISS: '1'
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
    SGLANG_DEFAULT_THINKING: '1'
    SGLANG_DSV4_REASONING_EFFORT: max
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
    SGLANG_OPT_SWA_EVICT_DROP_PAGE_MARGIN: '1'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_CUMEM_ENABLE: '1'
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
    MC_FORCE_MNNVL: '1'
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: '1'
  decode_environment:
    PYTHONUNBUFFERED: '1'
    SGLANG_RADIX_FORCE_MISS: '1'
    SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
    SGLANG_DEFAULT_THINKING: '1'
    SGLANG_DSV4_REASONING_EFFORT: max
    SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
    SGLANG_OPT_SWA_EVICT_DROP_PAGE_MARGIN: '1'
    NCCL_MNNVL_ENABLE: '1'
    NCCL_CUMEM_ENABLE: '1'
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
    MC_FORCE_MNNVL: '1'
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
    SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: '1'
  sglang_config:
    prefill:
      served-model-name: deepseek-ai/DeepSeek-V4-Pro
      model-path: /model/
      trust-remote-code: true
      disable-radix-cache: true
      disaggregation-mode: prefill
      disaggregation-transfer-backend: mooncake
      tensor-parallel-size: 4
      data-parallel-size: 1
      expert-parallel-size: 1
      moe-runner-backend: flashinfer_mxfp4
      disable-flashinfer-autotune: true
      mem-fraction-static: 0.9
      max-running-requests: 512
      cuda-graph-max-bs: 512
      chunked-prefill-size: 32768
    decode:
      served-model-name: deepseek-ai/DeepSeek-V4-Pro
      model-path: /model/
      trust-remote-code: true
      disable-radix-cache: true
      disaggregation-mode: decode
      disaggregation-transfer-backend: mooncake
      tensor-parallel-size: 4
      data-parallel-size: 1
      expert-parallel-size: 1
      moe-runner-backend: flashinfer_mxfp4
      disable-flashinfer-autotune: true
      mem-fraction-static: 0.9
      max-running-requests: 1024
      cuda-graph-max-bs: 512
      swa-full-tokens-ratio: 0.1
      context-length: 16384
  native_grpc_sidecar: true
  native_grpc_port: 50051
  sidecar_binary: dynamo-sglang-sidecar
  sidecar_args:
  - --sglang-connections
  - '8'
  - --health-deadline-secs
  - '1200'
benchmark:
  type: deterministic-smoke
  isl: 8192
  osl: 1024
  custom_tokenizer: sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer
  use_chat_template: false
setup_script: dsv4-smoke-setup.sh
